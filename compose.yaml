services:
  shanque:
    image: ${SHANQUE_IMAGE:-ffbum/shanque:1.0}
    ports:
      - "${SHANQUE_PORT:-5086}:5086"
    environment:
      SHANQUE_ADMIN_PASSWORD: "${SHANQUE_ADMIN_PASSWORD:?请先在 .env 中填写初始管理员密码}"
    volumes:
      - shanque-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5086/api/session', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  shanque-data:
    name: shanque-data
