services:
  shanque:
    image: ffbum/shanque:latest
    ports:
      - "${SHANQUE_PORT:-5086}:5086"
    environment:
      SHANQUE_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    secrets:
      - admin_password
    volumes:
      - shanque-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5086/api/session', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  admin_password:
    file: ./secrets/admin_password

volumes:
  shanque-data:
    name: shanque-data
