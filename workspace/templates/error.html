{% extends "base.html" %}
{% block title %}操作提示{% endblock %}
{% block content %}
  <div class="page">
    <div class="paper">
      <h1>操作提示</h1>
      <p>{{ error.description }}</p>

    </div>
  </div>
{% endblock %}
