{% extends "base.html" %}
{% block title %}修改密码{% endblock %}
{% block content %}
  <div class="page">
    <h1>修改密码</h1>
    <form class="paper" method="post">
      {{ csrf() }}<label>当前密码<input name="old" type="password" autocomplete="current-password" required>
      </label>
      <label>
        新密码<input type="password"
                  name="password"
                  minlength="8"
                  maxlength="128"
                  autocomplete="new-password"
                  required>
      </label>
      <button class="btn primary">保存密码</button>
    </form>
  </div>
{% endblock %}
